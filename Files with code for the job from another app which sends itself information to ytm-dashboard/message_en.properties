test.grading.report.unique.description=Create a list of graders for each test version. If an auto-assignment is enabled, grading requests will be immediately sent to the specified number of graders, determined by the 'Minimum number of submitted grader reports' configuration. Graders will be selected based on their position in the queue. For example, if the configuration is set to 2, the first two graders in the queue will receive the grading requests. If a grader rejects the request, it moves to the next in the queue until the minimum accepted reports are received. Graders will grade the questions, and their scores will contribute to the final result. In case of conflicting grades, the next grader in the queue will make the final decision. If the auto-assignment is disabled, you can manually select graders from the list for each candidate's report.
