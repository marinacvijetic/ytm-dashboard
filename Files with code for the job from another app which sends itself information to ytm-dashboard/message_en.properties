pools.actions.export.excel=Export to Excel
pools.actions.export.excel.availableQuestions=The list of the available questions types
pools.actions.export.excel.description=Choose how you want to export your questions into an Excel file. Two formats are available:
pools.actions.export.excel.generic=In-line Format (Single Sheet) - Lists each question and its answers in a single row. This format is easier to read and review in Excel but is not suitable for re-importing into the system.
pools.actions.export.excel.generic.description=Export to Excel is fully supported only for scoring methods "Defining correct/incorrect answers", "Manual grading" and "By grading rules" and the following question types
pools.actions.export.excel.generic.note=NOTE: The exported Excel file will contain both supported and non-supported questions. However, some information for non-supported question types will not be visible.
pools.actions.export.excel.intro=Export the questions from the pool into the Excel file. Depending on the selected \nexport format, only the questions of the available type will be exported.
pools.actions.export.excel.noWeightedQuestions=Note that only questions with the scoring type "Defining correct/incorrect answers" \nand "Manual grading" can be exported.
pools.actions.export.excel.preserveHtml=Preserve HTML
pools.actions.export.excel.preserveHtml.description=Keeps the original text formatting (like bold, italics, and links). The Excel file might be harder to read, but it ensures the text looks the same when imported into another system that supports formatting (HTML).
pools.actions.export.excel.sample=To preview how the exported Excel file will look, please download 
pools.actions.export.excel.sampleFile=this sample
pools.actions.export.excel.selectType=Select format
pools.actions.export.excel.ytm=YouTestMe Template (Import/Export Ready) - Generates an Excel file with two separate sheets: one for questions and one for answers. This format matches the required structure for importing questions into pools, making it ideal for transferring questions between different pools or environments.
pools.actions.export.excel.ytm.description=Export to Excel is supported only for scoring methods "Defining correct/incorrect answers", "Manual grading", "Weighted" and "By grading rules". Only Hot spot question type is not supported.
pools.actions.export.excel.ytm.note=NOTE: Non-supported question types will not prevent the export but will not be visible in the exported Excel file. Fill in the blanks question type has limited support - only simple textual input is supported.
pools.actions.export.json=Export to JSON
pools.actions.export.json.description=Export the pool to the custom JSON file format. You can import the pool from exported JSON file into another YouTestMe GetCertified application. The feature is suitable for data migration between different YouTestMe GetCertified environments. For example, you can prepare the pool in the testing environment and migrate it to the production environment when it is ready.
pools.actions.export.json.success=Pool exported to JSON file.
pools.actions.import.excel=Import pools from Excel
