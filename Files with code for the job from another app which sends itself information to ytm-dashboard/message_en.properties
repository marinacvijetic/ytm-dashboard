system.integrations.lti.configuration.id=Consumer key
system.integrations.lti.configuration.id.description=Use the provided "Consumer key" to configure the LTI Tool consumer. It represents the unique ID of the LTI configuration and, together with the provided "Secret key," is used to verify the LTI Launch request. The LTI Launch request must contain provided "Consumer key" value in the "oauth_consumer_key" parameter.
system.integrations.lti.configuration.secretKey=Secret key
system.integrations.lti.configuration.secretKey.description=Use the provided "Secret key" to configure the LTI Tool consumer. It represents the secret key used by an LTI Tool consumer to sign the LTI Launch request and the LTI tool provider (GetCertified) to verify the signature.
system.integrations.lti.configuration.signatureMethod=Signature method
system.integrations.lti.configuration.signatureMethod.description=Use the provided "Signature method" to configure the LTI Tool consumer. It represents the signature algorithm that an LTI Tool consumer must use to sign the LTI Launch request. The LTI Launch request must contain provided "Signature method" value in the "oauth_signature_method" parameter. The only supported signature method is "HMAC-SHA1".
system.integrations.lti.configuration.status.description=Choose the "Status" of the LTI configuration. If the status is "Enabled," configuration can be used for LTI Launch from LTI Tool consumer, otherwise not.
system.integrations.lti.configuration.url=Message URL
system.integrations.lti.configuration.url.description=Use the provided "Message URL" to configure the LTI Tool consumer. It represents the LTI endpoint where should LTI Tool consumer send the LTI Launch request.
system.integrations.lti.configuration.version=LTI version
system.integrations.lti.configuration.version.description=Use the provided "LTI version" to configure the LTI Tool consumer. It represents the LTI version that an LTI Tool consumer must use to send the LTI Launch request. The only supported version is "LTI-1po".
system.integrations.lti.description=Set up LTI integrations with external applications by configuring YouTestMe GetCertified as an LTI Tool provider. Connect the external application (LTI consumer) using the created LTI configuration. This allows users from the external application to seamlessly access YouTestMe GetCertified tests and receive results back to the external application. You can manage existing LTI configurations on this page, including adding new ones, updating, or deleting existing configurations.
