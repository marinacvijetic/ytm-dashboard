pools.introAllPools=Question pools are sets of questions used for generating tests/surveys. They can be structured hierarchically, enabling users to create sub-pools that are visible within the main question pool. There are two roles within the question pool: Modify, which allows users to manage the question pool and its questions, and Read-only, which permits users to use questions for test/survey generation without making any changes to the questions. The table below lists the question pools available to you.
